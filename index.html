<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>データベース</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased min-h-screen">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-50 w-full border-b border-gray-200 bg-white/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-md">
          D
        </div>
        <h1 class="font-bold text-xl text-gray-900 tracking-tight">データベース</h1>
      </div>

      <!-- GitHub API 設定ボタン -->
      <button onclick="openConfigModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-xs font-medium text-gray-700 hover:bg-gray-50 transition-colors shadow-sm">
        <i data-lucide="github" class="w-4 h-4"></i>
        <span>GitHub連携設定</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- 検索 & フィルターエリア -->
    <div class="space-y-6">
      
      <!-- 検索バー & 件数 -->
      <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
        <div class="relative w-full sm:w-96">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
          <input 
            type="text" 
            id="searchInput"
            placeholder="タイトル、作者、タグ等で検索..." 
            onkeyup="applyFilters()"
            class="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white shadow-sm text-sm"
          >
        </div>
        <div id="itemCount" class="text-sm font-medium text-gray-500">
          全 0 件
        </div>
      </div>

      <!-- クイックフィルターパネル -->
      <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-gray-500 tracking-wider uppercase flex items-center gap-1">
            <i data-lucide="filter" class="w-3.5 h-3.5"></i>
            クイックフィルター
          </span>
          <button onclick="clearAllFilters()" class="text-xs text-indigo-600 hover:underline hidden" id="clearFilterBtn">
            すべてのフィルターを解除
          </button>
        </div>

        <!-- 作字タイプ (複数選択) -->
        <div class="space-y-1">
          <div class="text-xs text-gray-400 font-medium">作字タイプ:</div>
          <div id="artTypeGroup" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- Ktype (作字タイプ「教育文字」選択時表示) -->
        <div id="ktypeSection" class="space-y-1 hidden">
          <div class="text-xs text-gray-400 font-medium">Ktype:</div>
          <div id="ktypeGroup" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- Atype (作字タイプ「アンビグラム」選択時表示) -->
        <div id="atypeSection" class="space-y-1 hidden">
          <div class="text-xs text-gray-400 font-medium">Atype:</div>
          <div id="atypeGroup" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- Tag -->
        <div class="space-y-1">
          <div class="text-xs text-gray-400 font-medium">Tag:</div>
          <div id="tagGroup" class="flex flex-wrap gap-1.5"></div>
        </div>
      </div>

      <!-- 新規登録モード -->
      <details class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden group">
        <summary class="flex items-center justify-between px-6 py-4 cursor-pointer select-none font-semibold text-gray-800 hover:bg-gray-50 transition-colors">
          <span class="flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i>
            新規作品の追加
          </span>
          <i data-lucide="chevron-down" class="w-5 h-5 text-gray-400 group-open:rotate-180 transition-transform"></i>
        </summary>
        
        <div class="p-6 border-t border-gray-100 bg-gray-50/50 space-y-6">
          
          <!-- 基本情報入力 -->
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">タイトル <span class="text-red-500">*</span></label>
              <input type="text" id="newTitle" placeholder="作品タイトルを入力" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">制作者名</label>
              <input type="text" id="newAuthor" placeholder="作者名を入力" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">投稿URL</label>
              <input type="text" id="newUrl" placeholder="https://..." class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>

          <!-- 分類選択 -->
          <div class="space-y-5 pt-2 border-t border-gray-200/60">
            
            <!-- 作字タイプ (複数選択) -->
            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-gray-600">作字タイプ (複数選択可)</label>
              <div id="newFormArtTypeGroup" class="flex flex-wrap gap-1.5"></div>
            </div>

            <!-- Ktype (作字タイプ「教育文字」選択時表示) -->
            <div id="newFormKtypeSection" class="space-y-1.5 hidden">
              <label class="block text-xs font-semibold text-gray-600">Ktype (複数選択可)</label>
              <div id="newFormKtypeGroup" class="flex flex-wrap gap-1.5"></div>
            </div>

            <!-- Atype (作字タイプ「アンビグラム」選択時表示) -->
            <div id="newFormAtypeSection" class="space-y-1.5 hidden">
              <label class="block text-xs font-semibold text-gray-600">Atype (複数選択可)</label>
              <div id="newFormAtypeGroup" class="flex flex-wrap gap-1.5"></div>
            </div>

            <!-- Tag -->
            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-gray-600">Tag (複数選択可)</label>
              <div id="newFormTagGroup" class="flex flex-wrap gap-1.5"></div>
            </div>

          </div>

          <div class="flex justify-end pt-2 border-t border-gray-200/60">
            <button id="addSubmitBtn" onclick="addData()" class="inline-flex items-center gap-2 px-5 py-2.5 bg-indigo-600 text-white font-medium text-sm rounded-lg hover:bg-indigo-700 transition-colors shadow-md">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>追加してGitHubへ保存</span>
            </button>
          </div>
        </div>
      </details>

    </div>

    <!-- ギャラリーグリッド -->
    <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  </main>

  <!-- GitHub設定用モーダル -->
  <div id="configModal" class="fixed inset-0 z-50 bg-gray-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl border border-gray-100">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-bold text-gray-900 flex items-center gap-2">
          <i data-lucide="github" class="w-5 h-5"></i>
          GitHub 連携設定
        </h3>
        <button onclick="closeConfigModal()" class="text-gray-400 hover:text-gray-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-gray-700 mb-1">GitHub ユーザー名 / 組織名</label>
          <input type="text" id="ghOwner" placeholder="例: username" class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div>
          <label class="block font-semibold text-gray-700 mb-1">リポジトリ名</label>
          <input type="text" id="ghRepo" placeholder="例: repository-name" class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div>
          <label class="block font-semibold text-gray-700 mb-1">ブランチ名</label>
          <input type="text" id="ghBranch" placeholder="main" class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div>
          <label class="block font-semibold text-gray-700 mb-1">Personal Access Token (repo権限)</label>
          <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <p class="text-gray-400 leading-relaxed">
          ※ トークン情報はブラウザの LocalStorage にのみ安全に保持され、外部サーバー等には送信されません。
        </p>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t">
        <button onclick="closeConfigModal()" class="px-4 py-2 rounded-lg text-xs font-medium text-gray-600 hover:bg-gray-100">キャンセル</button>
        <button onclick="saveGitHubConfig()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-medium hover:bg-indigo-700 shadow">保存</button>
      </div>
    </div>
  </div>

  <script>
    // 状態データ
    let database = [];
    let filterConfig = { artType: [], ktype: [], atype: [], tag: [] };
    let activeFilters = { artType: [], ktype: [], atype: [], tag: [] };

    // 新規追加フォームの選択状態 (artTypes を配列化)
    let newFormSelection = {
      artTypes: [],
      ktypes: [],
      atypes: [],
      tags: []
    };

    // GitHub API設定情報
    let ghConfig = {
      owner: '',
      repo: '',
      token: '',
      branch: 'main'
    };

    // スタイル定義マップ
    const CATEGORY_STYLES = {
      artType: { active: 'bg-indigo-50 text-indigo-700 border-indigo-200 font-bold shadow-sm ring-1 ring-indigo-400', prefix: '' },
      ktype:   { active: 'bg-gray-200 text-gray-800 border-gray-300 font-bold shadow-sm ring-1 ring-gray-400', prefix: '' },
      atype:   { active: 'bg-purple-100 text-purple-800 border-purple-300 font-bold shadow-sm ring-1 ring-purple-400', prefix: '' },
      tag:     { active: 'bg-amber-100 text-amber-800 border-amber-300 font-bold shadow-sm ring-1 ring-amber-400', prefix: '#' }
    };

    window.onload = async function() {
      loadGitHubConfig();
      await loadInitialData();
      renderUI();
    };

    // 設定読み込み
    function loadGitHubConfig() {
      const saved = localStorage.getItem('ambigram_gh_config');
      if (saved) {
        try { ghConfig = JSON.parse(saved); } catch(e) {}
      }
    }

    function openConfigModal() {
      document.getElementById('ghOwner').value = ghConfig.owner || '';
      document.getElementById('ghRepo').value = ghConfig.repo || '';
      document.getElementById('ghBranch').value = ghConfig.branch || 'main';
      document.getElementById('ghToken').value = ghConfig.token || '';
      document.getElementById('configModal').classList.remove('hidden');
    }

    function closeConfigModal() {
      document.getElementById('configModal').classList.add('hidden');
    }

    function saveGitHubConfig() {
      ghConfig.owner = document.getElementById('ghOwner').value.trim();
      ghConfig.repo = document.getElementById('ghRepo').value.trim();
      ghConfig.branch = document.getElementById('ghBranch').value.trim() || 'main';
      ghConfig.token = document.getElementById('ghToken').value.trim();
      localStorage.setItem('ambigram_gh_config', JSON.stringify(ghConfig));
      closeConfigModal();
      alert("GitHub連携設定を保存しました。");
    }

    // 同一階層のJSONファイルを自動取得
    async function loadInitialData() {
      try {
        const [configRes, dbRes] = await Promise.all([
          fetch('./option.json'),
          fetch('./database.json')
        ]);

        if (configRes.ok) {
          filterConfig = await configRes.json();
        } else {
          console.error("option.json の読み込みに失敗しました");
        }

        if (dbRes.ok) {
          database = await dbRes.json();
        } else {
          console.error("database.json の読み込みに失敗しました");
        }
      } catch (error) {
        console.error("JSONデータの読み込み中にエラーが発生しました:", error);
      }
    }

    // 一括再描画・更新処理
    function renderUI() {
      renderFilterButtons();
      renderNewFormButtons();
      applyFilters();
    }

    // フィルター用ボタン生成
    function renderFilterButtons() {
      const categories = [
        { key: 'artType', containerId: 'artTypeGroup' },
        { key: 'ktype', containerId: 'ktypeGroup' },
        { key: 'atype', containerId: 'atypeGroup' },
        { key: 'tag', containerId: 'tagGroup' }
      ];

      categories.forEach(({ key, containerId }) => {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        const items = filterConfig[key] || [];
        const { active: activeClass, prefix } = CATEGORY_STYLES[key];

        items.forEach(val => {
          const isActive = activeFilters[key].includes(val);
          const btn = document.createElement('button');
          btn.className = `text-xs px-2.5 py-1 rounded-full border transition-all ${
            isActive ? activeClass : 'border-gray-200 bg-white text-gray-600 hover:bg-gray-50'
          }`;
          btn.textContent = `${prefix}${val}`;
          btn.onclick = () => toggleFilter(key, val);
          container.appendChild(btn);
        });
      });

      document.getElementById('ktypeSection').classList.toggle('hidden', !activeFilters.artType.includes('教育文字'));
      document.getElementById('atypeSection').classList.toggle('hidden', !activeFilters.artType.includes('アンビグラム'));

      const hasActive = Object.values(activeFilters).some(arr => arr.length > 0) || document.getElementById("searchInput").value.trim() !== "";
      document.getElementById('clearFilterBtn').classList.toggle('hidden', !hasActive);
    }

    // 新規登録フォーム用ボタン生成
    function renderNewFormButtons() {
      // 作字タイプ (複数選択)
      const artTypeContainer = document.getElementById('newFormArtTypeGroup');
      artTypeContainer.innerHTML = '';
      (filterConfig.artType || []).forEach(val => {
        const isActive = newFormSelection.artTypes.includes(val);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `text-xs px-2.5 py-1 rounded-full border transition-all ${
          isActive ? CATEGORY_STYLES.artType.active : 'border-gray-200 bg-white text-gray-600 hover:bg-gray-50'
        }`;
        btn.textContent = val;
        btn.onclick = () => {
          toggleArrayItem(newFormSelection.artTypes, val);
          if (!newFormSelection.artTypes.includes('教育文字')) newFormSelection.ktypes = [];
          if (!newFormSelection.artTypes.includes('アンビグラム')) newFormSelection.atypes = [];
          renderNewFormButtons();
        };
        artTypeContainer.appendChild(btn);
      });

      // Ktype
      const ktypeContainer = document.getElementById('newFormKtypeGroup');
      ktypeContainer.innerHTML = '';
      (filterConfig.ktype || []).forEach(val => {
        const isActive = newFormSelection.ktypes.includes(val);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `text-xs px-2.5 py-1 rounded-full border transition-all ${
          isActive ? CATEGORY_STYLES.ktype.active : 'border-gray-200 bg-white text-gray-600 hover:bg-gray-50'
        }`;
        btn.textContent = val;
        btn.onclick = () => {
          toggleArrayItem(newFormSelection.ktypes, val);
          renderNewFormButtons();
        };
        ktypeContainer.appendChild(btn);
      });

      // Atype
      const atypeContainer = document.getElementById('newFormAtypeGroup');
      atypeContainer.innerHTML = '';
      (filterConfig.atype || []).forEach(val => {
        const isActive = newFormSelection.atypes.includes(val);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `text-xs px-2.5 py-1 rounded-full border transition-all ${
          isActive ? CATEGORY_STYLES.atype.active : 'border-gray-200 bg-white text-gray-600 hover:bg-gray-50'
        }`;
        btn.textContent = val;
        btn.onclick = () => {
          toggleArrayItem(newFormSelection.atypes, val);
          renderNewFormButtons();
        };
        atypeContainer.appendChild(btn);
      });

      // Tag
      const tagContainer = document.getElementById('newFormTagGroup');
      tagContainer.innerHTML = '';
      (filterConfig.tag || []).forEach(val => {
        const isActive = newFormSelection.tags.includes(val);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `text-xs px-2.5 py-1 rounded-full border transition-all ${
          isActive ? CATEGORY_STYLES.tag.active : 'border-gray-200 bg-white text-gray-600 hover:bg-gray-50'
        }`;
        btn.textContent = `#${val}`;
        btn.onclick = () => {
          toggleArrayItem(newFormSelection.tags, val);
          renderNewFormButtons();
        };
        tagContainer.appendChild(btn);
      });

      document.getElementById('newFormKtypeSection').classList.toggle('hidden', !newFormSelection.artTypes.includes('教育文字'));
      document.getElementById('newFormAtypeSection').classList.toggle('hidden', !newFormSelection.artTypes.includes('アンビグラム'));
    }

    function toggleArrayItem(arr, item) {
      const idx = arr.indexOf(item);
      if (idx > -1) arr.splice(idx, 1);
      else arr.push(item);
    }

    // フィルタートグル処理
    function toggleFilter(category, val) {
      const idx = activeFilters[category].indexOf(val);
      if (idx > -1) {
        activeFilters[category].splice(idx, 1);
      } else {
        activeFilters[category].push(val);
      }

      if (category === 'artType') {
        if (!activeFilters.artType.includes('教育文字')) activeFilters.ktype = [];
        if (!activeFilters.artType.includes('アンビグラム')) activeFilters.atype = [];
      }

      renderFilterButtons();
      applyFilters();
    }

    function clearAllFilters() {
      activeFilters = { artType: [], ktype: [], atype: [], tag: [] };
      document.getElementById("searchInput").value = "";
      renderFilterButtons();
      applyFilters();
    }

    // 検索・フィルタリング実行
    function applyFilters() {
      const query = document.getElementById("searchInput").value.toLowerCase();

      const filtered = database.filter(item => {
        if (query && !Object.values(item).some(val => String(val).toLowerCase().includes(query))) {
          return false;
        }

        if (activeFilters.artType.length > 0) {
          const artType = item.artType || '';
          if (!activeFilters.artType.some(v => artType.includes(v))) return false;
        }

        if (activeFilters.artType.includes('教育文字') && activeFilters.ktype.length > 0) {
          const hasK = activeFilters.ktype.some(v => 
            Object.keys(item).some(k => k.startsWith('ktype') && String(item[k]).includes(v))
          );
          if (!hasK) return false;
        }

        if (activeFilters.artType.includes('アンビグラム') && activeFilters.atype.length > 0) {
          const hasA = activeFilters.atype.some(v => 
            Object.keys(item).some(a => a.startsWith('atype') && String(item[a]).includes(v))
          );
          if (!hasA) return false;
        }

        if (activeFilters.tag.length > 0) {
          const tagVal = item.Tag || item.tag || '';
          if (!activeFilters.tag.some(v => tagVal.includes(v))) return false;
        }

        return true;
      });

      renderCards(filtered);
    }

    // Twitter/X のURLを正規化する関数
    function normalizeTwitterUrl(urlStr) {
      if (!urlStr) return '';
      let url = urlStr.trim();

      // プロトコル（https://）が無い場合に補完
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }

      try {
        const parsed = new URL(url);
        // x.com または twitter.com のポストURLか判定
        if (parsed.hostname.includes('x.com') || parsed.hostname.includes('twitter.com')) {
          // ? 以降のクエリパラメータを削除したパスを取得
          let pathname = parsed.pathname;

          // /photo/ や /video/ などのメディア指定以降を切り捨て
          pathname = pathname.replace(/\/(photo|video)\/.*$/i, '');

          // 末尾の余計なスラッシュを整形
          pathname = pathname.replace(/\/+$/, '');

          return `https://${parsed.hostname}${pathname}`;
        }
      } catch (e) {
        // URLオブジェクトにパースできない場合は正規表現でフォールバック処理
        let cleaned = url.split('?')[0]; // ? 以降削除
        cleaned = cleaned.replace(/\/(photo|video)\/.*$/i, ''); // /photo/ 以降削除
        cleaned = cleaned.replace(/\/+$/, '');
        return cleaned;
      }

      return url;
    }

    // 新規作品の追加処理（GitHub API連携）
    async function addData() {
      if (!ghConfig.owner || !ghConfig.repo || !ghConfig.token) {
        alert("GitHub連携設定が未登録です。画面右上の「GitHub連携設定」から情報を設定してください。");
        openConfigModal();
        return;
      }

      const title = document.getElementById("newTitle").value.trim();
      if (!title) { alert("タイトルを入力してください。"); return; }

      // URLの整形処理を通す
      const rawUrl = document.getElementById("newUrl").value.trim();
      const normalizedUrl = normalizeTwitterUrl(rawUrl);

      const btn = document.getElementById("addSubmitBtn");
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>保存中...</span>`;
      lucide.createIcons();

      const newItem = {
        title,
        author: document.getElementById("newAuthor").value.trim(),
        url: normalizedUrl,
        artType: newFormSelection.artTypes.join(', ')
      };

      if (newFormSelection.artTypes.includes('教育文字')) {
        newFormSelection.ktypes.forEach((v, idx) => { newItem[`ktype${idx + 1}`] = v; });
      }
      if (newFormSelection.artTypes.includes('アンビグラム')) {
        newFormSelection.atypes.forEach((v, idx) => { newItem[`atype${idx + 1}`] = v; });
      }
      if (newFormSelection.tags.length > 0) {
        newItem["Tag"] = newFormSelection.tags.join(', ');
      }

      const updatedDatabase = [...database, newItem];

      try {
        await commitToGitHub("database.json", updatedDatabase, `Add entry: ${title}`);
        
        database = updatedDatabase;

        // フォームクリア
        document.getElementById("newTitle").value = "";
        document.getElementById("newAuthor").value = "";
        document.getElementById("newUrl").value = "";
        newFormSelection = { artTypes: [], ktypes: [], atypes: [], tags: [] };

        renderNewFormButtons();
        applyFilters();
        alert("GitHubへ正常に保存されました！");
      } catch (error) {
        console.error(error);
        alert(`保存に失敗しました:\n${error.message}`);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="plus" class="w-4 h-4"></i><span>追加してGitHubへ保存</span>`;
        lucide.createIcons();
      }
    }

    // GitHub API 経由でのファイル更新関数
    async function commitToGitHub(filePath, dataObject, commitMessage) {
      const branch = ghConfig.branch || 'main';
      const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${filePath}?ref=${branch}`;
      const headers = {
        "Authorization": `token ${ghConfig.token}`,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      };

      // 既存ファイルの SHA 取得
      const getRes = await fetch(url, { headers });
      if (!getRes.ok) {
        if (getRes.status === 404) {
          throw new Error(`ファイル (${filePath}) またはリポジトリが見つかりません。\n・ユーザー名: ${ghConfig.owner}\n・リポジトリ名: ${ghConfig.repo}\n・ブランチ名: ${branch}\n上記の設定情報およびファイル位置を確認してください。`);
        }
        throw new Error(`ファイル情報取得失敗 (${getRes.status})`);
      }

      const fileData = await getRes.json();
      const sha = fileData.sha;

      // Base64 エンコード (日本語対応)
      const jsonString = JSON.stringify(dataObject, null, 2);
      const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

      // API を叩いてコミット
      const putUrl = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${filePath}`;
      const putRes = await fetch(putUrl, {
        method: "PUT",
        headers,
        body: JSON.stringify({
          message: commitMessage,
          content: encodedContent,
          sha: sha,
          branch: branch
        })
      });

      if (!putRes.ok) {
        const errorData = await putRes.json();
        throw new Error(errorData.message || "GitHub APIコミットエラー");
      }
    }

    // ギャラリー描画
    function renderCards(data) {
      const grid = document.getElementById("cardGrid");
      const countLabel = document.getElementById("itemCount");
      grid.innerHTML = "";
      countLabel.textContent = `全 ${data.length} 件`;

      if (!data || data.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-gray-400 bg-white rounded-2xl border border-dashed border-gray-200">
            <i data-lucide="folder-open" class="w-12 h-12 mx-auto mb-3 text-gray-300"></i>
            <p class="font-medium text-gray-500">該当するデータが存在しません</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      data.forEach((item) => {
        const ktypes = Object.keys(item).filter(k => k.startsWith('ktype') && item[k]).map(k => item[k]);
        const atypes = Object.keys(item).filter(a => a.startsWith('atype') && item[a]).map(a => item[a]);
        const tag = item.Tag || item.tag || '';
        const initial = (item.title || 'D').charAt(0).toUpperCase();

        const card = document.createElement("div");
        card.className = "bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition-all duration-200 overflow-hidden flex flex-col justify-between group";
        card.innerHTML = `
          <div>
            <div class="h-40 bg-gradient-to-br from-indigo-50 to-purple-50 flex items-center justify-center p-6 relative">
              <div class="w-20 h-20 rounded-2xl bg-white/80 backdrop-blur shadow-sm flex items-center justify-center text-indigo-600 text-3xl font-black transition-transform group-hover:scale-105">
                ${initial}
              </div>
            </div>

            <div class="p-5 space-y-4">
              <div>
                <div class="flex items-start justify-between gap-2 mb-1">
                  <h3 class="font-bold text-gray-900 text-lg leading-snug px-1">
                    ${item.title || '無題'}
                  </h3>

                  ${item.artType ? `
                    <span class="shrink-0 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100">
                      ${item.artType}
                    </span>
                  ` : ''}
                </div>

                <p class="text-sm text-gray-500 px-1">
                  作者: <span>${item.author || '未設定'}</span>
                </p>
              </div>

              <div class="flex flex-wrap gap-1.5 text-xs">
                ${ktypes.map(k => `<span class="px-2 py-0.5 rounded bg-gray-100 text-gray-600 font-mono">K:${k}</span>`).join('')}
                ${atypes.map(a => `<span class="px-2 py-0.5 rounded bg-purple-50 text-purple-600 font-mono">A:${a}</span>`).join('')}
                ${tag ? `<span class="px-2 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-100">#${tag}</span>` : ''}
              </div>
            </div>
          </div>

          <div class="p-5 pt-0">
            ${item.url ? `
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 w-full py-2 px-4 rounded-xl bg-gray-900 text-white text-sm font-medium hover:bg-gray-800 transition-colors shadow-sm">
                <span>作品を見る</span>
                <i data-lucide="external-link" class="w-4 h-4"></i>
              </a>
            ` : `
              <button disabled class="inline-flex items-center justify-center gap-2 w-full py-2 px-4 rounded-xl bg-gray-100 text-gray-400 text-sm font-medium cursor-not-allowed">
                <span>リンクなし</span>
              </button>
            `}
          </div>
        `;

        grid.appendChild(card);
      });

      lucide.createIcons();
    }
  </script>
